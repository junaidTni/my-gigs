<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100k Users — AWS DevOps Production Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{
  --bg:#ffffff;--bg2:#f8f9fa;--bg3:#f1f3f5;
  --text:#1a1a2e;--text2:#495057;--text3:#868e96;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --accent:#228be6;--accent-bg:#e7f5ff;--accent-text:#1864ab;
  --success-bg:#ebfbee;--success-text:#2b8a3e;--success-border:#69db7c;
  --warn-bg:#fff9db;--warn-text:#e67700;--warn-border:#ffd43b;
  --danger-bg:#fff5f5;--danger-text:#c92a2a;--danger-border:#ff8787;
  --radius:10px;--radius-sm:6px;
}
[data-theme="dark"]{
  --bg:#1a1b1e;--bg2:#25262b;--bg3:#2c2e33;
  --text:#f1f3f5;--text2:#ced4da;--text3:#868e96;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --accent:#4dabf7;--accent-bg:#1c3d5a;--accent-text:#74c0fc;
  --success-bg:#1a3a24;--success-text:#8ce99a;--success-border:#40c057;
  --warn-bg:#3a2e00;--warn-text:#ffd43b;--warn-border:#e67700;
  --danger-bg:#3a1a1a;--danger-text:#ff8787;--danger-border:#c92a2a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo-badge{background:var(--accent);color:#fff;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.nb{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;font-weight:500;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:5px}
.nb:hover{background:var(--bg2)}
.nb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.theme-btn:hover{background:var(--bg2)}
.main{max-width:900px;margin:0 auto;padding:24px}
.view{display:none}.view.active{display:block}
.vh{margin-bottom:18px}
.vt{font-size:18px;font-weight:600;color:var(--text);margin-bottom:4px}
.vs{font-size:13px;color:var(--text3);line-height:1.6}
.top-actions{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.prog-label{font-size:12px;color:var(--text3)}
.eab{font-size:12px;color:var(--accent);background:transparent;border:1px solid var(--border2);border-radius:20px;cursor:pointer;padding:4px 12px;font-family:'Inter',sans-serif;display:flex;align-items:center;gap:4px;margin-left:auto}
.eab:hover{background:var(--bg2)}
.eab+.eab{margin-left:6px}
.pb{height:4px;background:var(--bg3);border-radius:2px;margin-bottom:16px;overflow:hidden}
.pf{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.step{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:9px;overflow:hidden;transition:border-color .15s}
.step:hover{border-color:var(--border2)}
.step.open{border-color:var(--accent)}
.sh{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;background:var(--bg);user-select:none;transition:background .15s}
.sh:hover{background:var(--bg2)}
.sn{width:26px;height:26px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text3);flex-shrink:0;transition:all .2s}
.step.open .sn{background:var(--accent);border-color:var(--accent);color:#fff}
.st{font-size:13.5px;font-weight:500;color:var(--text);flex:1;line-height:1.4}
.sb{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--bg3);color:var(--text3);border:1px solid var(--border);flex-shrink:0;white-space:nowrap}
.step.open .sb{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
.chv{color:var(--text3);font-size:17px;flex-shrink:0;transition:transform .25s}
.step.open .chv{transform:rotate(180deg)}
.sbody{display:none;padding:4px 16px 16px;border-top:1px solid var(--border)}
.step.open .sbody{display:block}
.explain{background:var(--bg2);border-radius:var(--radius-sm);padding:11px 13px;margin-top:11px}
.explain p{font-size:13px;color:var(--text2);line-height:1.7}
.explain p+p{margin-top:6px}
.lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-top:14px;margin-bottom:7px}
ul.li{list-style:none;margin-top:2px}
ul.li li{font-size:13px;color:var(--text);padding:3px 0 3px 18px;position:relative;line-height:1.6}
ul.li li::before{content:'';position:absolute;left:5px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6}
pre{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px 15px;margin-top:8px;overflow-x:auto}
code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);line-height:1.75;white-space:pre}
.note{font-size:12.5px;color:var(--accent-text);background:var(--accent-bg);border-left:3px solid var(--accent);border-radius:0;padding:8px 12px;margin-top:9px;line-height:1.6}
.warn{font-size:12.5px;color:var(--warn-text);background:var(--warn-bg);border-left:3px solid var(--warn-border);border-radius:0;padding:8px 12px;margin-top:9px;line-height:1.6}
.ok{font-size:12.5px;color:var(--success-text);background:var(--success-bg);border-left:3px solid var(--success-border);border-radius:0;padding:8px 12px;margin-top:9px;line-height:1.6}
.tw{overflow-x:auto;margin-top:9px;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
th{text-align:left;padding:7px 10px;background:var(--bg2);color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td{padding:7px 10px;border-top:1px solid var(--border);color:var(--text);vertical-align:top;line-height:1.55;font-size:12.5px;word-break:break-word}
tr:hover td{background:var(--bg2)}
.diagram-wrap{margin-top:12px;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;padding:16px;background:var(--bg2)}
footer{text-align:center;padding:28px;font-size:12px;color:var(--text3);border-top:1px solid var(--border);margin-top:40px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <i class="ti ti-server" style="color:var(--accent);font-size:18px"></i>
    AWS Production Guide
    <span class="logo-badge">100k users</span>
  </div>
  <div class="nav" id="mainnav"></div>
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="Toggle dark mode">
    <i class="ti ti-moon"></i>
  </button>
</div>

<div class="main">
  <div id="viewsContainer"></div>
</div>

<footer>100k Users AWS Production Guide &nbsp;·&nbsp; Next.js + NestJS + Supabase &nbsp;·&nbsp; EC2 + ECS flows</footer>

<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderSecs(secs){
  return secs.map(s=>{
    if(s.type==='explain') return `<div class="explain">${s.content.map(p=>`<p>${p}</p>`).join('')}</div>`;
    if(s.type==='lbl') return `<p class="lbl">${s.text}</p>`;
    if(s.type==='items') return `<ul class="li">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    if(s.type==='code') return `<pre><code>${esc(s.code)}</code></pre>`;
    if(s.type==='note') return `<div class="note"><i class="ti ti-info-circle"></i> ${s.text}</div>`;
    if(s.type==='warn') return `<div class="warn"><i class="ti ti-alert-triangle"></i> ${s.text}</div>`;
    if(s.type==='ok') return `<div class="ok"><i class="ti ti-circle-check"></i> ${s.text}</div>`;
    if(s.type==='table') return `<div class="tw"><table><thead><tr>${s.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(s.type==='diagram') return s.html;
    return '';
  }).join('');
}

function makeSteps(steps,pfx){
  return steps.map((s,i)=>{
    const id=`${pfx}_${i}`;
    return `<div class="step" id="${id}">
      <div class="sh" onclick="tog('${id}','${pfx}')">
        <div class="sn">${i+1}</div>
        <span class="st">${s.title}</span>
        <span class="sb">${s.badge}</span>
        <i class="ti ti-chevron-down chv"></i>
      </div>
      <div class="sbody">${renderSecs(s.sections)}</div>
    </div>`;
  }).join('');
}

function tog(id,pfx){
  document.getElementById(id).classList.toggle('open');
  updProg(pfx);
}
function updProg(pfx){
  const total=document.querySelectorAll(`[id^="${pfx}_"]`).length;
  const open=document.querySelectorAll(`[id^="${pfx}_"].open`).length;
  const b=document.getElementById('pb_'+pfx),l=document.getElementById('pl_'+pfx);
  if(b) b.style.width=Math.round(open/total*100)+'%';
  if(l) l.textContent=`${open} / ${total} expanded`;
}
function expandAll(pfx){document.querySelectorAll(`[id^="${pfx}_"]`).forEach(e=>e.classList.add('open'));updProg(pfx);}
function collapseAll(pfx){document.querySelectorAll(`[id^="${pfx}_"]`).forEach(e=>e.classList.remove('open'));updProg(pfx);}
function showView(v,btn){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(x=>x.classList.remove('active'));
  document.getElementById(v).classList.add('active');
  btn.classList.add('active');
}
function buildView(vid,title,sub,steps,pfx){
  document.getElementById(vid).innerHTML=`
    <div class="vh"><p class="vt">${title}</p><p class="vs">${sub}</p></div>
    <div class="top-actions">
      <span class="prog-label" id="pl_${pfx}">0 / ${steps.length} expanded</span>
      <button class="eab" onclick="expandAll('${pfx}')"><i class="ti ti-chevrons-down"></i> Expand all</button>
      <button class="eab" onclick="collapseAll('${pfx}')"><i class="ti ti-chevrons-up"></i> Collapse all</button>
    </div>
    <div class="pb"><div class="pf" id="pb_${pfx}" style="width:0%"></div></div>
    ${makeSteps(steps,pfx)}`;
}
function toggleTheme(){
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'':'dark');
  document.getElementById('themeBtn').innerHTML=dark?'<i class="ti ti-moon"></i>':'<i class="ti ti-sun"></i>';
}

// ── VIEWS ──
const views=[
  {id:'diagram', label:'Infra diagram',   icon:'ti-topology-star'},
  {id:'ec2',     label:'EC2 flow',        icon:'ti-server'},
  {id:'ecs',     label:'ECS flow',        icon:'ti-box'},
  {id:'shared',  label:'Shared setup',    icon:'ti-settings'},
  {id:'cost',    label:'Cost & monitoring',icon:'ti-coin'}
];
document.getElementById('mainnav').innerHTML=views.map((v,i)=>
  `<button class="nb${i===0?' active':''}" onclick="showView('${v.id}',this)"><i class="ti ${v.icon}"></i> ${v.label}</button>`
).join('');
document.getElementById('viewsContainer').innerHTML=views.map((v,i)=>
  `<div class="view${i===0?' active':''}" id="${v.id}"></div>`
).join('');

// ── DATA ──────────────────────────────────────────────────────

const diagramData=[

import { SSMClient, GetParameterCommand } from "@aws-sdk/client-ssm";

async function getParam(name: string): Promise<string> {
  const client = new SSMClient({ region: "us-east-1" });
  const res = await client.send(new GetParameterCommand({
    Name: name, WithDecryption: true
  }));
  return (res.Parameter && res.Parameter.Value) ? res.Parameter.Value : '';
}

{title:"Step 10 — GitHub Actions CI/CD pipeline",badge:"Auto deploy on push",sections:[
  {type:"explain",content:[
    "Push to main → test → build Docker image → scan for CVEs → push to ECR → trigger ASG instance refresh. The ASG launches new instances with the new image, waits for health checks, then removes old instances. Zero downtime, fully automated."
  ]},
  {type:"lbl",text:"GitHub repo secrets to add (Settings → Secrets → Actions)"},
  {type:"items",items:[
    "AWS_ACCOUNT_ID — your 12-digit AWS account number",
    "SLACK_WEBHOOK — Slack incoming webhook URL for deploy notifications",
    "No AWS access keys needed — we use OIDC (see Shared Setup tab)"
  ]},
  {type:"code",code:`# .github/workflows/deploy.yml  (NestJS repo)
name: Deploy NestJS to production

on:
  push:
    branches: [main]

env:
  REGION: us-east-1
  ECR: \${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  TAG: sha-\${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: AWS credentials via OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::\${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy
          aws-region: \${{ env.REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login \
            --username AWS --password-stdin \${{ env.ECR }}

      - name: Build and scan for CVEs
        run: docker build --target production -t nestjs-app .

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: nestjs-app
          exit-code: 1
          severity: CRITICAL
          ignore-unfixed: true

      - name: Push to ECR
        run: |
          docker tag nestjs-app \${{ env.ECR }}/nestjs-app:\${{ env.TAG }}
          docker tag nestjs-app \${{ env.ECR }}/nestjs-app:latest
          docker push \${{ env.ECR }}/nestjs-app:\${{ env.TAG }}
          docker push \${{ env.ECR }}/nestjs-app:latest

      - name: Rolling deploy — ASG instance refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name nestjs-asg \
            --preferences '{"MinHealthyPercentage":100,"InstanceWarmup":120}'

      - name: Wait for rolling deploy to complete
        run: |
          while true; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name nestjs-asg \
              --query 'InstanceRefreshes[0].Status' --output text)
            echo "Deploy status: $STATUS"
            [ "$STATUS" = "Successful" ] && break
            [ "$STATUS" = "Failed" ] && exit 1
            sleep 30
          done

      - name: Smoke test
        run: curl --fail https://yourdomain.com/api/health || exit 1

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: '{"text":"NestJS deploy \${{ job.status }} — \${{ env.TAG }}"}'
        env:
          SLACK_WEBHOOK_URL: \${{ secrets.SLACK_WEBHOOK }}`},
  {type:"note",text:"MinHealthyPercentage: 100 means the ASG always adds a new instance before removing an old one. Zero requests are ever dropped. If the new instance fails health checks the refresh stops and all traffic continues on old instances."}
]},

{title:"Step 3 — create Task Definitions",badge:"Container blueprints",sections:[
  {type:"explain",content:["A Task Definition is the ECS equivalent of a docker-compose.yml service entry. Create one for NestJS and one for Next.js. Register via ECS Console → Task Definitions → Create new task definition → JSON tab."]},
  {type:"lbl",text:"NestJS Task Definition JSON"},
  {type:"code",code:`{
  "family": "nestjs-task",
  "networkMode": "awsvpc",
  "requiresCompatibilities": ["FARGATE"],
  "cpu": "512",
  "memory": "1024",
  "executionRoleArn": "arn:aws:iam::ACCOUNT_ID:role/ecsTaskExecutionRole",
  "taskRoleArn":      "arn:aws:iam::ACCOUNT_ID:role/ecsTaskExecutionRole",
  "containerDefinitions": [{
    "name": "nestjs",
    "image": "ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/nestjs-app:latest",
    "portMappings": [{ "containerPort": 4000, "protocol": "tcp" }],
    "environment": [{ "name": "NODE_ENV", "value": "production" }],
    "secrets": [
      {
        "name": "DATABASE_URL",
        "valueFrom": "arn:aws:ssm:us-east-1:ACCOUNT_ID:parameter/prod/nestjs/database-url"
      },
      {
        "name": "JWT_SECRET",
        "valueFrom": "arn:aws:ssm:us-east-1:ACCOUNT_ID:parameter/prod/nestjs/jwt-secret"
      }
    ],
    "logConfiguration": {
      "logDriver": "awslogs",
      "options": {
        "awslogs-group": "/ecs/nestjs",
        "awslogs-region": "us-east-1",
        "awslogs-stream-prefix": "nestjs"
      }
    },
    "healthCheck": {
      "command": ["CMD-SHELL","curl -f http://localhost:4000/health || exit 1"],
      "interval": 30, "timeout": 5, "retries": 3, "startPeriod": 60
    }
  }]
}`},
  {type:"note",text:"Create nextjs-task similarly: family=nextjs-task, port 3000, image nextjs-app, remove secrets (Next.js connects to API via HTTP, not directly to DB)."}
]},
{title:"Step 4 — ALB and target groups (same as EC2 step 7)",badge:"Load balancer",sections:[
  {type:"explain",content:["ALB setup is identical to the EC2 flow. Only difference: when creating target groups, choose type 'IP addresses' instead of 'Instances' — Fargate tasks get dynamic IPs, not fixed instance IDs."]},
  {type:"items",items:[
    "Create nestjs-tg: type IP addresses, port 4000, health check /health",
    "Create nextjs-tg: type IP addresses, port 3000, health check /",
    "Create ALB prod-alb in public subnets with alb-sg",
    "HTTPS:443 listener: /api/* → nestjs-tg, /* → nextjs-tg",
    "HTTP:80 listener: redirect to HTTPS"
  ]}
]},
{title:"Step 5 — create ECS Services",badge:"Run containers",sections:[
  {type:"explain",content:["An ECS Service keeps N tasks running. It registers tasks with the ALB target group, monitors health, replaces unhealthy tasks, and handles zero-downtime rolling deploys automatically."]},
  {type:"lbl",text:"Create NestJS service (ECS → prod-cluster → Services → Create)"},
  {type:"items",items:[
    "Launch type: Fargate | Task definition: nestjs-task | Revision: LATEST",
    "Service name: nestjs-service | Desired tasks: 2",
    "VPC: prod-vpc | Subnets: BOTH private subnets | Security group: nestjs-task-sg",
    "Public IP: DISABLED (private subnet — ALB reaches tasks internally)",
    "Load balancer: prod-alb | Container port: 4000 | Target group: nestjs-tg",
    "Click Create"
  ]},
  {type:"items",items:["Repeat for Next.js: task=nextjs-task, name=nextjs-service, SG=nextjs-task-sg, TG=nextjs-tg"]},
  {type:"ok",text:"ECS now runs your containers, health-checks them via ALB, auto-replaces unhealthy tasks, and handles rolling deploys. No servers to SSH into, no systemd, no docker-compose."}
]},
{title:"Step 6 — GitHub Actions pipeline for ECS",badge:"CI/CD",sections:[
  {type:"explain",content:["For ECS the deploy step is different from EC2. Instead of triggering an instance refresh, you register a new Task Definition revision with the new image and update the ECS service. ECS handles the rolling deploy automatically."]},
  {type:"code",code:`# .github/workflows/deploy.yml  (NestJS repo — ECS version)
name: Deploy NestJS to ECS

on:
  push:
    branches: [main]

env:
  REGION: us-east-1
  ECR: \${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  TAG: sha-\${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run lint && npm test

      - uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::\${{ secrets.AWS_ACCOUNT_ID }}:role/github-deploy
          aws-region: \${{ env.REGION }}

      - run: |
          aws ecr get-login-password | docker login \
            --username AWS --password-stdin \${{ env.ECR }}

      - run: |
          docker build -t app .
          docker tag app \${{ env.ECR }}/nestjs-app:\${{ env.TAG }}
          docker tag app \${{ env.ECR }}/nestjs-app:latest
          docker push \${{ env.ECR }}/nestjs-app:\${{ env.TAG }}
          docker push \${{ env.ECR }}/nestjs-app:latest

      - name: Update task definition with new image
        id: td
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-arn: arn:aws:ecs:us-east-1:\${{ secrets.AWS_ACCOUNT_ID }}:task-definition/nestjs-task
          container-name: nestjs
          image: \${{ env.ECR }}/nestjs-app:\${{ env.TAG }}

      - name: Deploy to ECS — rolling update
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: \${{ steps.td.outputs.task-definition }}
          service: nestjs-service
          cluster: prod-cluster
          wait-for-service-stability: true`},
  {type:"note",text:"wait-for-service-stability: true — pipeline waits until new task passes ALB health checks before marking success. If health checks fail, ECS never removes old task. Automatic zero-downtime rollback."}
]},
{title:"Step 7 — Route 53 and SSL (same as EC2 step 11)",badge:"Go live",sections:[
  {type:"explain",content:["Route 53 and ACM setup is identical to the EC2 flow. Request ACM certificate, create hosted zone, add ALIAS A records pointing to prod-alb DNS name, update nameservers at your registrar. Done."]},
  {type:"ok",text:"After DNS propagates: https://yourdomain.com → Next.js via ALB → ECS Fargate tasks. https://yourdomain.com/api → NestJS. Google-managed SSL. Auto-scales. Zero servers to manage."}
]}
];

  {type:"explain",content:[
    "Instead of storing AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in GitHub secrets (long-term credentials that can leak), use OIDC. GitHub proves its identity with a short-lived token. AWS issues temporary credentials per job run. Nothing is stored anywhere."

  {type:"code",code:`# Step 1 — create OIDC identity provider in IAM
aws iam create-open-id-connect-provider \
  --url https://token.actions.githubusercontent.com \
  --client-id-list sts.amazonaws.com \
  --thumbprint-list 6938fd4d98bab03faadb97b34396831e3780aea1

# Step 2 — create IAM role GitHub can assume
aws iam create-role --role-name github-deploy \
  --assume-role-policy-document '{
    "Version":"2012-10-17","Statement":[{
      "Effect":"Allow",
      "Principal":{"Federated":"arn:aws:iam::ACCOUNT_ID:oidc-provider/token.actions.githubusercontent.com"},
      "Action":"sts:AssumeRoleWithWebIdentity",
      "Condition":{
        "StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},

      }
    }]

# Step 3 — attach ECR permissions

{title:"VPC endpoints — eliminate NAT Gateway charges for ECR and S3",badge:"Cost saving",sections:[
  {type:"explain",content:["By default, EC2 instances in private subnets pull Docker images from ECR through the NAT Gateway — costing $0.045/GB. VPC endpoints create a private path inside AWS, bypassing NAT entirely for ECR and S3 traffic."]},
  {type:"code",code:`# S3 gateway endpoint — free

  --vpc-id YOUR_VPC_ID \
  --service-name com.amazonaws.us-east-1.s3 \

  --subnet-ids PRIVATE_SUBNET_AZ1 PRIVATE_SUBNET_AZ2 \
  --security-group-ids NESTJS_SG_ID NEXTJS_SG_ID

  --vpc-id YOUR_VPC_ID \
  --vpc-endpoint-type Interface \
  --service-name com.amazonaws.us-east-1.ecr.api \

  --security-group-ids NESTJS_SG_ID NEXTJS_SG_ID`},

{title:"Rollback strategy — undo a bad deploy",badge:"Safety net",sections:[
  {type:"lbl",text:"EC2 rollback — re-tag previous SHA as latest"},
  {type:"code",code:`# Get last stable image tag (pipeline stores this in Parameter Store)
PREV=$(aws ssm get-parameter --name "/prod/nestjs/last-stable-tag" \
  --query Parameter.Value --output text)
echo "Rolling back to: $PREV"

# Re-tag previous SHA image as latest in ECR
MANIFEST=$(aws ecr batch-get-image --repository-name nestjs-app \
  --image-ids imageTag=$PREV \
  --query 'images[0].imageManifest' --output text)
aws ecr put-image --repository-name nestjs-app \
  --image-tag latest --image-manifest "$MANIFEST"

# Trigger fresh rolling deploy — picks up re-tagged image
aws autoscaling start-instance-refresh \
  --auto-scaling-group-name nestjs-asg \
  --preferences '{"MinHealthyPercentage":100,"InstanceWarmup":60}'`},
  {type:"lbl",text:"ECS rollback — update service to previous task definition revision"},
  {type:"code",code:`# List recent task definition revisions
aws ecs list-task-definitions --family-prefix nestjs-task \
  --sort DESC --max-items 5

# Roll back to previous revision number
aws ecs update-service \
  --cluster prod-cluster \
  --service nestjs-service \
  --task-definition nestjs-task:PREVIOUS_REVISION_NUMBER
# ECS rolling deploy runs automatically — zero downtime`},
  {type:"lbl",text:"Cancel a rolling deploy midway (EC2)"},
  {type:"code",code:`# If you catch a bad deploy early — cancel before all instances replace
aws autoscaling cancel-instance-refresh \
  --auto-scaling-group-name nestjs-asg
# Old instances remain — no changes made to production`},
