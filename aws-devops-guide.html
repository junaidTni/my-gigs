<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud DevOps Guide — AWS & GCP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root {
  --bg: #ffffff;
  --bg2: #f8f9fa;
  --bg3: #f1f3f5;
  --text: #1a1a2e;
  --text2: #495057;
  --text3: #868e96;
  --border: rgba(0,0,0,0.1);
  --border2: rgba(0,0,0,0.18);
  --accent: #228be6;
  --accent-bg: #e7f5ff;
  --accent-text: #1864ab;
  --success-bg: #ebfbee;
  --success-text: #2b8a3e;
  --success-border: #69db7c;
  --warn-bg: #fff9db;
  --warn-text: #e67700;
  --warn-border: #ffd43b;
  --danger-bg: #fff5f5;
  --danger-text: #c92a2a;
  --radius: 10px;
  --radius-sm: 6px;
}
[data-theme="dark"] {
  --bg: #1a1b1e;
  --bg2: #25262b;
  --bg3: #2c2e33;
  --text: #f1f3f5;
  --text2: #ced4da;
  --text3: #868e96;
  --border: rgba(255,255,255,0.1);
  --border2: rgba(255,255,255,0.18);
  --accent: #4dabf7;
  --accent-bg: #1c3d5a;
  --accent-text: #74c0fc;
  --success-bg: #1a3a24;
  --success-text: #8ce99a;
  --success-border: #40c057;
  --warn-bg: #3a2e00;
  --warn-text: #ffd43b;
  --warn-border: #e67700;
  --danger-bg: #3a1a1a;
  --danger-text: #ff8787;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:16px}
.logo{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap}
.logo span{color:var(--accent)}
.nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.nb{font-size:12px;padding:6px 14px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s;font-weight:500;font-family:'Inter',sans-serif}
.nb:hover{background:var(--bg2);color:var(--text)}
.nb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.theme-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.theme-btn:hover{background:var(--bg2)}
.main{max-width:860px;margin:0 auto;padding:28px 24px}
.view{display:none}.view.active{display:block}
.view-header{margin-bottom:20px}
.view-title{font-size:20px;font-weight:600;color:var(--text);margin-bottom:5px}
.view-sub{font-size:13px;color:var(--text3);line-height:1.6}
.step{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;transition:border-color .15s}
.step:hover{border-color:var(--border2)}
.step.open{border-color:var(--accent)}
.sh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;background:var(--bg);user-select:none;transition:background .15s}
.sh:hover{background:var(--bg2)}
.sn{width:28px;height:28px;border-radius:50%;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text3);flex-shrink:0;transition:all .2s}
.step.open .sn{background:var(--accent);border-color:var(--accent);color:#fff}
.stitle{font-size:14px;font-weight:500;color:var(--text);flex:1;line-height:1.4}
.sbadge{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--bg3);color:var(--text3);border:1px solid var(--border);flex-shrink:0;white-space:nowrap}
.step.open .sbadge{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent)}
.chv{color:var(--text3);font-size:18px;flex-shrink:0;transition:transform .25s}
.step.open .chv{transform:rotate(180deg)}
.sbody{display:none;padding:4px 16px 16px;border-top:1px solid var(--border)}
.step.open .sbody{display:block}
.explain{background:var(--bg2);border-radius:var(--radius-sm);padding:12px 14px;margin-top:12px}
.explain p{font-size:13px;color:var(--text2);line-height:1.7}
.explain p+p{margin-top:6px}
.lbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-top:16px;margin-bottom:8px}
ul.li{list-style:none;margin-top:2px}
ul.li li{font-size:13px;color:var(--text);padding:3px 0 3px 18px;position:relative;line-height:1.6}
ul.li li::before{content:'';position:absolute;left:5px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6}
pre{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;margin-top:8px;overflow-x:auto}
code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text);line-height:1.75;white-space:pre}
.note{font-size:12.5px;color:var(--accent-text);background:var(--accent-bg);border-left:3px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:9px 12px;margin-top:10px;line-height:1.6}
.warn{font-size:12.5px;color:var(--warn-text);background:var(--warn-bg);border-left:3px solid var(--warn-border);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:9px 12px;margin-top:10px;line-height:1.6}
.ok{font-size:12.5px;color:var(--success-text);background:var(--success-bg);border-left:3px solid var(--success-border);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:9px 12px;margin-top:10px;line-height:1.6}
.flow{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-top:10px;font-size:12.5px;color:var(--text2);line-height:2.2;overflow-x:auto;white-space:nowrap}
.flow .fnode{display:inline-block;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:3px 10px;color:var(--text);font-weight:500;font-size:12px;white-space:nowrap}
.flow .farr{color:var(--accent);margin:0 4px;font-weight:600}
.tw{overflow-x:auto;margin-top:10px;border-radius:var(--radius-sm);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:9px 12px;background:var(--bg2);color:var(--text3);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--border);color:var(--text);vertical-align:top;line-height:1.5}
tr:hover td{background:var(--bg2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:12px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.card-icon{font-size:22px;color:var(--accent);margin-bottom:8px}
.card-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text3);line-height:1.5}
.progress-bar{height:4px;background:var(--bg3);border-radius:2px;margin-bottom:20px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.expand-all{font-size:12px;color:var(--accent);background:transparent;border:none;cursor:pointer;padding:0;font-family:'Inter',sans-serif;margin-left:auto;display:flex;align-items:center;gap:4px}
.expand-all:hover{opacity:.8}
.top-actions{display:flex;align-items:center;margin-bottom:14px}
.prog-label{font-size:12px;color:var(--text3)}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">AWS <span>DevOps</span> Guide</div>
  <div class="nav" id="mainnav">
    <button class="nb active" onclick="show('overview',this)"><i class="ti ti-layout-grid"></i> Services overview</button>
    <button class="nb" onclick="show('ec2flow',this)"><i class="ti ti-server"></i> EC2 flow</button>
    <button class="nb" onclick="show('ecsflow',this)"><i class="ti ti-box"></i> ECS flow</button>
    <button class="nb" onclick="show('cost',this)"><i class="ti ti-coin"></i> Cost control</button>
    <!-- <button class="nb" onclick="show('interview',this)"><i class="ti ti-school"></i> Interview prep</button> -->
  </div>
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="Toggle dark mode"><i class="ti ti-moon"></i></button>
</div>

<div class="main">
  <div id="overview" class="view active"></div>
  <div id="ec2flow" class="view"></div>
  <div id="ecsflow" class="view"></div>
  <div id="cost" class="view"></div>
  <!-- <div id="interview" class="view"></div> -->
</div>

<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function renderSecs(secs){
  return secs.map(s=>{
    if(s.type==='explain') return `<div class="explain">${s.content.map(p=>`<p>${p}</p>`).join('')}</div>`;
    if(s.type==='lbl') return `<p class="lbl">${s.text}</p>`;
    if(s.type==='items') return `<ul class="li">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
    if(s.type==='code') return `<pre><code>${esc(s.code)}</code></pre>`;
    if(s.type==='note') return `<div class="note"><i class="ti ti-info-circle"></i> ${s.text}</div>`;
    if(s.type==='warn') return `<div class="warn"><i class="ti ti-alert-triangle"></i> ${s.text}</div>`;
    if(s.type==='ok') return `<div class="ok"><i class="ti ti-circle-check"></i> ${s.text}</div>`;
    if(s.type==='flow'){
      const html = s.html.replace(/<span class="arr">/g,'<span class="farr">').replace(/<span>/g,'<span class="fnode">');
      return `<div class="flow">${html}</div>`;
    }
    if(s.type==='table') return `<div class="tw"><table><thead><tr>${s.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    if(s.type==='cards') return `<div class="cards">${s.cards.map(c=>`<div class="card"><div class="card-icon"><i class="ti ti-${c.icon}"></i></div><p class="card-title">${c.title}</p><p class="card-sub">${c.sub}</p></div>`).join('')}</div>`;
    return '';
  }).join('');
}

function makeSteps(steps, prefix){
  return steps.map((s,i)=>{
    const id = prefix+'_'+i;
    return `<div class="step" id="${id}">
      <div class="sh" onclick="tog('${id}','${prefix}')">
        <div class="sn">${i+1}</div>
        <span class="stitle">${s.title}</span>
        <span class="sbadge">${s.badge}</span>
        <i class="ti ti-chevron-down chv"></i>
      </div>
      <div class="sbody">${renderSecs(s.sections)}</div>
    </div>`;
  }).join('');
}

const counters = {};
function tog(id, prefix){
  const el = document.getElementById(id);
  el.classList.toggle('open');
  updateProgress(prefix);
}
function updateProgress(prefix){
  const total = document.querySelectorAll(`[id^="${prefix}_"]`).length;
  const open = document.querySelectorAll(`[id^="${prefix}_"].open`).length;
  const bar = document.getElementById('prog_'+prefix);
  const lbl = document.getElementById('progl_'+prefix);
  if(bar) bar.style.width = Math.round(open/total*100)+'%';
  if(lbl) lbl.textContent = open+' / '+total+' expanded';
}
function expandAll(prefix){
  document.querySelectorAll(`[id^="${prefix}_"]`).forEach(el=>el.classList.add('open'));
  updateProgress(prefix);
}
function collapseAll(prefix){
  document.querySelectorAll(`[id^="${prefix}_"]`).forEach(el=>el.classList.remove('open'));
  updateProgress(prefix);
}

function show(v, btn){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nb').forEach(x=>x.classList.remove('active'));
  document.getElementById(v).classList.add('active');
  btn.classList.add('active');
}

function toggleTheme(){
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', isDark ? '' : 'dark');
  document.getElementById('themeBtn').innerHTML = isDark ? '<i class="ti ti-moon"></i>' : '<i class="ti ti-sun"></i>';
}

function buildView(id, title, sub, steps, prefix){
  const stepsHTML = makeSteps(steps, prefix);
  document.getElementById(id).innerHTML = `
    <div class="view-header">
      <p class="view-title">${title}</p>
      <p class="view-sub">${sub}</p>
    </div>
    <div class="top-actions">
      <span class="prog-label" id="progl_${prefix}">0 / ${steps.length} expanded</span>
      <button class="expand-all" onclick="expandAll('${prefix}')"><i class="ti ti-chevrons-down"></i> Expand all</button>
      &nbsp;
      <button class="expand-all" onclick="collapseAll('${prefix}')"><i class="ti ti-chevrons-up"></i> Collapse all</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog_${prefix}" style="width:0%"></div></div>
    ${stepsHTML}`;
}

    {type:"code", code:`name: Deploy NestJS to ECS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: \${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_TAG: \${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: \${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: \${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: \${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password | docker login --username AWS \\
            --password-stdin \${{ env.ECR_REGISTRY }}

      - name: Build and push image (tagged with SHA for rollback)
        run: |
          docker build -t nestjs-app .
          docker tag nestjs-app \${{ env.ECR_REGISTRY }}/nestjs-app:\${{ env.IMAGE_TAG }}
          docker tag nestjs-app \${{ env.ECR_REGISTRY }}/nestjs-app:latest
          docker push \${{ env.ECR_REGISTRY }}/nestjs-app:\${{ env.IMAGE_TAG }}
          docker push \${{ env.ECR_REGISTRY }}/nestjs-app:latest

      - name: Get current task definition
        run: |
          aws ecs describe-task-definition --task-definition nestjs-task \\
            --query taskDefinition > task-def.json

      - name: Update image in task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def.json
          container-name: nestjs-app
          image: \${{ env.ECR_REGISTRY }}/nestjs-app:\${{ env.IMAGE_TAG }}

      - name: Deploy to ECS — rolling update
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: \${{ steps.task-def.outputs.task-definition }}
          service: nestjs-service
          cluster: prod-cluster
          wait-for-service-stability: true`},

  Browser connects to ALB on port 443
  ALB presents ACM SSL certificate for yourdomain.com
  Browser verifies certificate with Certificate Authority (Amazon)
  Encrypted TLS session established between browser and ALB

Step 3 — ALB SSL termination
  ALB decrypts the HTTPS request
  Reads URL path: is it /api/* or /*?
  Forwards plain HTTP internally to the correct target group

Step 4 — Container receives request
  EC2 flow: Nginx → Docker container (plain HTTP)
  ECS flow: ALB → ECS task directly (plain HTTP)
  App processes request, returns response

Step 5 — Response returns
  Container → ALB → ALB encrypts response → Browser decrypts it

Key insight: HTTPS only exists between browser and ALB.
Internal traffic (ALB → app) is plain HTTP — acceptable because
it travels inside a private VPC subnet, never the public internet.`}
